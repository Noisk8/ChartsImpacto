<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gráfica de Arte y Pensamiento</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link
  href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&display=swap"
  rel="stylesheet"
/>
  <style>
    .tooltip {
      position: absolute;
      background: rgba(255, 255, 255, 0.9);
      color: rgb(0, 0, 0);
      border-radius: 3px;
      pointer-events: none;
      transition: all .1s ease;
      transform: translate(-50%, -50%);
      font-family: Oswald, sans-serif;
      font-size: 16px;
      padding: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      text-align: center;
    }
    .tooltip .label,
    .tooltip .value {
      margin: 10px 0;
      font-weight: bold;
    }
    .tooltip .description {
      margin: 10px 0;
    }
    .info-card{
      cursor: pointer;
    }
    .info-card:hover {
        background-color: #5dc1b9;
        color: white;
    }
    .info-card:hover h1 {
        color: #db3434;
    }
  </style>
</head>
<body>
  <canvas id="myPieChart"></canvas>
  <div style="display: flex; justify-content: center; align-items: center; padding-top: 30px;">
    <div  class="info-card" style="text-align: center; font-family: 'Oswald', sans-serif; font-size: 24px; padding: 10px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); border-radius: 5px;">
       <p>Participantes directos y constantes en procesos de creación y formación durante 2025:</p>
    <script>
        function animateValue(id, start, end, duration) {
                const obj = document.getElementById(id);
                let startTimestamp = null;
                const step = (timestamp) => {
                        if (!startTimestamp) startTimestamp = timestamp;
                        const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                        const value = Math.round(progress * (end - start) + start);
                        obj.innerHTML = value.toLocaleString('es-ES');
                        if (progress < 1) {
                                window.requestAnimationFrame(step);
                        }
                };
                window.requestAnimationFrame(step);
        }

        document.addEventListener("DOMContentLoaded", function() {
                animateValue("count", 0, 182, 2000);
        });
    </script>
    <h1 id="count">0</h1>
    </div>
</div>
  <script>
    var ctx = document.getElementById('myPieChart').getContext('2d');
    const data = {
      labels: [
        'Equipo del proyecto',
        'Participantes directos y constantes',
        'Asistentes a encuentros y espacios públicos',
        'Personas alcanzadas en circulación ampliada',
        'Visualizaciones de la estrategia digital'
      ],
      descriptions: [
        "15 personas en el equipo del proyecto",
        "182 participantes directos y constantes en procesos de creación y formación",
        "287 asistentes a encuentros y espacios públicos",
        "29.445 personas alcanzadas en circulación ampliada",
        "114.865 visualizaciones de la estrategia digital"
      ],
      datasets: [{
        data: [15, 182, 287, 29445, 114865],
        backgroundColor: ['#5dc1b9', '#8fe8e0', '#db3434', '#eb7575', '#7b61ff'],
        hoverBackgroundColor: ['#a23e46', '#70171f', '#24cbcb', '#148a8a', '#3a2bbf'],
        borderColor: '#000000',
        borderWidth: 1
      }]
    };

    const options = {
      responsive: true,
      plugins: {
        legend: {
          labels: {
            font: {
              size: 18
            }
          }
        },
        tooltip: {
          enabled: false,
          external: function (context) {
            var tooltipEl = document.getElementById("chartjs-tooltip");
            if (!tooltipEl) {
              tooltipEl = document.createElement("div");
              tooltipEl.id = "chartjs-tooltip";
              tooltipEl.classList.add("tooltip");
              document.body.appendChild(tooltipEl);
            }
            var tooltipModel = context.tooltip;
            if (tooltipModel.opacity === 0) {
              tooltipEl.style.opacity = 0;
              return;
            }
            if (tooltipModel.body) {
              var titleLines = tooltipModel.title || [];
              var bodyLines = tooltipModel.body.map(function (bodyItem) {
                return bodyItem.lines;
              });
              var description = data.descriptions[tooltipModel.dataPoints[0].dataIndex];
              var innerHtml =
                '<div class="label">' + titleLines.join("") + "</div>";
              innerHtml +=
                '<div class="value">' + bodyLines.join("") + "</div>";
              innerHtml +=
                '<div class="description">' + description + "</div>";
              tooltipEl.innerHTML = innerHtml;
            }
            var position = context.chart.canvas.getBoundingClientRect();
            tooltipEl.style.opacity = 1;
            tooltipEl.style.position = "absolute";
            tooltipEl.style.left =
              position.left +
              window.pageXOffset +
              tooltipModel.caretX +
              "px";
            tooltipEl.style.top =
              position.top +
              window.pageYOffset +
              tooltipModel.caretY +
              "px";
            tooltipEl.style.transform = "translate(-50%, -50%)";
            tooltipEl.style.fontFamily = "Oswald, sans-serif";
            tooltipEl.style.fontSize = "26px";
            tooltipEl.style.fontStyle = tooltipModel.options.bodyFont.style;
          }
        }
      },
      onHover: function(event, chartElement) {
        event.native.target.style.cursor = chartElement[0] ? 'pointer' : 'default';
      }
    };

    const myPieChart = new Chart(ctx, {
      type: 'pie',
      data: data,
      options: options
    });
  </script>
</body>
</html>
